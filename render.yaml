# Render Blueprint for the Parkly API (https://render.com/docs/blueprint-spec).
# Create it in Render with: New -> Blueprint -> select this repository.
services:
  - type: web
    name: parkly-api
    runtime: node
    plan: free
    region: singapore # closest Render region to India
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    # Deploys are triggered by GitHub Actions only after CI passes (see .github/workflows/ci.yml).
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true # Render creates a strong random secret
      - key: JWT_EXPIRES_IN
        value: 7d
      # Values below are entered in the Render dashboard (never committed).
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
