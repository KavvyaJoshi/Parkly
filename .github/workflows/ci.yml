name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client:
    name: Client (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  server:
    name: Server (lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests run against the real MongoDB service container above.
      MONGODB_TEST_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test

  # Continuous deployment: only after every CI job has passed on main.
  deploy-api:
    name: Deploy API to Render
    needs: [client, server]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL secret is not set yet - skipping deploy."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Render deploy triggered for ${GITHUB_SHA::7}."

      - name: Smoke-test the live API
        if: vars.API_URL != ''
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          # The free instance may be asleep or restarting; retry for up to ~5 minutes.
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 20 "$API_URL/api/health" | grep -q '"database":"connected"'; then
              echo "Live API is healthy and connected to the database."
              exit 0
            fi
            echo "Attempt $attempt: not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "::error::Live API did not become healthy in time."
          exit 1